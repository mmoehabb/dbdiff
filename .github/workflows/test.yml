name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '>=1.24.0'

    - name: Build
      run: go build -v ./...

    - name: Start Docker
      run: systemctl is-active docker || sudo systemctl start docker

    - name: Test
      run: go test -v ./...
