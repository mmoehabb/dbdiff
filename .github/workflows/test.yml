name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build
      run: go build -v ./...

    - name: Start Docker
      run: systemctl is-active docker || sudo systemctl start docker

    - name: Unit tests
      run: go test -race -short ./...

    - name: Required SQL Server integration tests
      env:
        DBDIFF_REQUIRE_MSSQL: "1"
      run: go test -v -count=1 -timeout=15m ./internal/adapters/mssql -run TestMSSQLIntegration
